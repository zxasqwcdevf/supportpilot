<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupportPilot · 상담 작업실</title><link rel="stylesheet" href="/static/style.css"></head>
<body><aside><div class="brand">S<span>SupportPilot</span></div><p class="subtitle">상담 작업실</p><button id="new" class="primary">+ 새 문의</button><h2>최근 문의</h2><div id="history"></div></aside>
<main><header><div><p class="eyebrow">LOCAL SUPPORT WORKSPACE</p><h1>근거를 확인하고 답변하세요.</h1></div><span id="connection">연결 확인 중</span></header>
<section class="card"><h2>고객 문의</h2><form id="form"><textarea id="question" maxlength="2000" required placeholder="고객의 문의를 입력하세요."></textarea><details><summary>환불 정보 추가</summary><div class="fields"><label>요금제<select id="plan"><option value="">미확인</option><option value="annual">연간</option><option value="monthly">월간</option></select></label><label>결제일<input type="date" id="payment"></label><label>사용 이력<select id="usage"><option value="">미확인</option><option value="true">있음</option><option value="false">없음</option></select></label></div></details><button id="generate" class="primary" type="submit">답변 초안 만들기</button></form></section>
<p id="notice" role="status" aria-live="polite"></p><div id="result" hidden><div class="columns"><section class="card"><div class="section-head"><h2>답변 검토</h2><span id="status" class="badge"></span></div><p id="original"></p><label>상담원 답변<textarea id="edited" maxlength="4000"></textarea></label><label>검토자 이름<input id="reviewer" maxlength="100" placeholder="검토자 이름"></label><div class="actions"><button id="approve" class="primary">수정 답변 승인</button><button id="reject">초안 반려</button></div><p class="muted">승인은 이 작업실에 기록됩니다. 고객에게 전송하거나 환불을 실행하지 않습니다.</p><div id="review-record"></div></section><section class="card"><h2>답변 근거</h2><div id="citations"></div><details><summary>검토한 문서와 판정 정보</summary><pre id="trace"></pre></details></section></div></div>
</main><script src="/static/app.js"></script></body></html>
