name: CPU tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / CPU
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPPORTPILOT_MODEL_URL: ""
      SUPPORTPILOT_RETRIEVAL: keyword
      SUPPORTPILOT_WARMUP: "0"
      SUPPORTPILOT_DB: ${{ runner.temp }}/supportpilot-ci.sqlite3
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Run unit and API tests
        run: python -m pytest -q --junitxml=test-results/junit.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-test-results
          path: test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 7
